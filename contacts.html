        <a href="contacts.html" class="contact">связаться со мной</a>
    </header>

    <main>
        <section class="contact-section">
            <div class="contact-intro">
                <h1 class="page-title">Связаться со мной</h1>
                <p class="page-desc">Есть предложение, вопрос или хочешь обсудить проект? Заполни форму ниже, и я отвечу тебе в ближайшее время.</p>
            </div>

            <form class="contact-form" action="https://formspree.io/f/mlgkpqgg" method="POST">
                <div class="form-group">
                    <label for="name">Твоё имя</label>
                    <input type="text" id="name" name="name" placeholder="Иван" required>
                </div>

                <div class="form-group">
                    <label for="email">Email для связи</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Сообщение</label>
                    <textarea id="message" name="message" rows="5" placeholder="Привет! Хочу заказать сайт..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Отправить сообщение</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-left">
            <span>&copy;2026 саят</span>
